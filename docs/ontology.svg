<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1180 400" xmlns="http://www.w3.org/2000/svg" width="1180" height="400" role="img" aria-label="Two parts. Ontology, in data/categories.ttl: groceries and eating out are kinds of food, sport is a kind of leisure. Rules, in data/known_expenses.csv: Delhaize and Carrefour count as groceries; Kantipuri, Simple Asia and Nona count as eating out; VUB Zwembad and A Bloc count as sport." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<style>
.bg{fill:#ffffff}
.b{stroke-width:1.2}
.b.code{fill:#e6f0f9;stroke:#1f6fb2}
.b.cat{fill:#f8eddd;stroke:#a8641b}
.b.you{fill:#e5f3eb;stroke:#2f7d55}
.bar.o{fill:#1f6fb2}.bar.r{fill:#2f7d55}
.bt{fill:#ffffff;font:600 12px system-ui,-apple-system,"Segoe UI",sans-serif;text-anchor:middle;letter-spacing:.06em}
.t{fill:#16202c;font:600 13px system-ui,-apple-system,"Segoe UI",sans-serif;text-anchor:middle}
.m{fill:#16202c;font:500 12px system-ui,-apple-system,"Segoe UI",sans-serif;text-anchor:middle}
.s{fill:#5b6876;font:400 11px ui-monospace,Menlo,Consolas,monospace;text-anchor:middle}
.f{fill:#5b6876;font:400 11px ui-monospace,Menlo,Consolas,monospace}
.a{stroke:#5b6876;stroke-width:1.5;fill:none}
.a.y{stroke:#2f7d55;stroke-dasharray:5 4}
.sep{stroke:#d4dae1;stroke-width:1;stroke-dasharray:2 4}
.ah{fill:#5b6876}.ahy{fill:#2f7d55}
.lab{fill:#5b6876;font:400 11px system-ui,-apple-system,"Segoe UI",sans-serif}
.lv{fill:#16202c;font:600 12px system-ui,-apple-system,"Segoe UI",sans-serif}
</style>
<rect class="bg" width="1180" height="400"/>
<defs>
  <marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="ah" d="M0,0L10,5L0,10z"/></marker>
  <marker id="my" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="ahy" d="M0,0L10,5L0,10z"/></marker>
</defs>

<!-- ONTOLOGY: level1 groups -->
<rect class="b code" x="260" y="30" width="150" height="50" rx="25"/>
<text class="t" x="335" y="60">food</text>
<rect class="b code" x="715" y="30" width="150" height="50" rx="25"/>
<text class="t" x="790" y="60">leisure</text>

<!-- ONTOLOGY: level2 = the categories used in known_expenses.csv -->
<rect class="b cat" x="125" y="130" width="150" height="50" rx="25"/>
<text class="t" x="200" y="152">groceries</text><text class="s" x="200" y="168">also: supermarket</text>
<rect class="b cat" x="395" y="130" width="150" height="50" rx="25"/>
<text class="t" x="470" y="152">eating out</text><text class="s" x="470" y="168">also: restaurants</text>
<rect class="b cat" x="715" y="130" width="150" height="50" rx="25"/>
<text class="t" x="790" y="160">sport</text>

<!-- is a kind of (skos:broader): child -> parent -->
<path class="a" d="M200,130 L320,82" marker-end="url(#m)"/>
<path class="a" d="M470,130 L350,82" marker-end="url(#m)"/>
<path class="a" d="M790,130 V82" marker-end="url(#m)"/>

<!-- separator between the two parts -->
<path class="sep" d="M60,215 H915"/>

<!-- RULES: merchants -->
<rect class="b you" x="77" y="250" width="106" height="34" rx="17"/><text class="m" x="130" y="271">Delhaize</text>
<rect class="b you" x="192" y="250" width="106" height="34" rx="17"/><text class="m" x="245" y="271">Carrefour</text>
<rect class="b you" x="307" y="250" width="106" height="34" rx="17"/><text class="m" x="360" y="271">Kantipuri</text>
<rect class="b you" x="422" y="250" width="106" height="34" rx="17"/><text class="m" x="475" y="271">Simple Asia</text>
<rect class="b you" x="537" y="250" width="106" height="34" rx="17"/><text class="m" x="590" y="271">Nona</text>
<rect class="b you" x="677" y="250" width="106" height="34" rx="17"/><text class="m" x="730" y="271">VUB Zwembad</text>
<rect class="b you" x="797" y="250" width="106" height="34" rx="17"/><text class="m" x="850" y="271">A Bloc</text>

<!-- counts as: merchant -> category -->
<path class="a y" d="M130,250 L185,182" marker-end="url(#my)"/>
<path class="a y" d="M245,250 L215,182" marker-end="url(#my)"/>
<path class="a y" d="M360,250 L450,182" marker-end="url(#my)"/>
<path class="a y" d="M475,250 L472,182" marker-end="url(#my)"/>
<path class="a y" d="M590,250 L490,182" marker-end="url(#my)"/>
<path class="a y" d="M730,250 L775,182" marker-end="url(#my)"/>
<path class="a y" d="M850,250 L805,182" marker-end="url(#my)"/>

<!-- side bars -->
<rect class="bar o" x="935" y="30" width="24" height="150" rx="4"/>
<text class="bt" transform="translate(951,105) rotate(-90)">ONTOLOGY</text>
<rect class="bar r" x="935" y="236" width="24" height="62" rx="4"/>
<text class="bt" transform="translate(951,267) rotate(-90)">RULES</text>

<!-- labels next to the bars -->
<text class="f" x="975" y="20">data/categories.ttl</text>
<text class="lv" x="975" y="52">level1</text><text class="lab" x="975" y="68">top group</text>
<text class="lv" x="975" y="152">category</text><text class="lab" x="975" y="168">same text as in the rules</text>
<text class="f" x="975" y="230">data/known_expenses.csv</text>
<text class="lv" x="975" y="264">merchants</text><text class="lab" x="975" y="280">found in the bank text</text>

<!-- legend -->
<path class="a" d="M90,336 H140" marker-end="url(#m)"/>
<text class="lab" x="150" y="340">is a kind of  (skos:broader)</text>
<path class="a y" d="M390,336 H440" marker-end="url(#my)"/>
<text class="lab" x="450" y="340">counts as  (one rule line)</text>
<text class="lab" x="90" y="372">Example: a payment at Nona is eating out (rule), eating out is food (ontology). add_levels writes both into level1 and level2.</text>
</svg>
