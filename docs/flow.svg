<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1080 500" xmlns="http://www.w3.org/2000/svg" width="1080" height="500" role="img" aria-label="Bank CSV files stored in data/ are loaded and normalized, classified with exceptional.csv first and known_expenses.csv second, and produce reports including uncategorised.csv, which you review to add new rules." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
        <style>
.bg{fill:#ffffff}
.b{fill:#ffffff;stroke:#d4dae1;stroke-width:1.2}
.b.code{fill:#e6f0f9;stroke:#1f6fb2}
.b.you{fill:#e5f3eb;stroke:#2f7d55}
.b.rule{fill:#f8eddd;stroke:#a8641b}
.b.later{fill:none;stroke:#5b6876;stroke-dasharray:4 4}
.t{fill:#16202c;font:600 13px system-ui,-apple-system,"Segoe UI",sans-serif;text-anchor:middle}
.s{fill:#5b6876;font:400 11px ui-monospace,Menlo,Consolas,monospace;text-anchor:middle}
.a{stroke:#5b6876;stroke-width:1.5;fill:none}
.a.loop{stroke:#2f7d55;stroke-dasharray:5 4}
.ah{fill:#5b6876}.ahy{fill:#2f7d55}
.lab{fill:#5b6876;font:400 11px system-ui,-apple-system,"Segoe UI",sans-serif}
.lab.y{fill:#2f7d55}
</style>
<rect class="bg" width="1080" height="500"/>
        <defs>
          <marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="ah" d="M0,0L10,5L0,10z"/></marker>
          <marker id="my" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="ahy" d="M0,0L10,5L0,10z"/></marker>
        </defs>

        <!-- main row -->
        <rect class="b you" x="40" y="112" width="260" height="60" rx="30"/>
        <text class="t" x="170" y="138">Bank CSV files</text><text class="s" x="170" y="156">stored in data/</text>
        <text class="lab" x="170" y="200" text-anchor="middle">Supported formats:</text>
        <text class="lab" x="170" y="216" text-anchor="middle">BNP Paribas Fortis · Belfius</text>

        <rect class="b code" x="400" y="112" width="160" height="60" rx="30"/>
        <text class="t" x="480" y="138">Load + normalize</text><text class="s" x="480" y="156">one English table</text>

        <rect class="b code" x="600" y="112" width="150" height="60" rx="30"/>
        <text class="t" x="675" y="138">Classify</text><text class="s" x="675" y="156">first rule wins</text>

        <rect class="b code" x="790" y="112" width="130" height="60" rx="30"/>
        <text class="t" x="855" y="138">Reports</text><text class="s" x="855" y="156">data/processed/</text>

        <rect class="b later" x="950" y="112" width="116" height="60" rx="30"/>
        <text class="t" x="1008" y="138">Dashboard</text><text class="s" x="1008" y="156">later, Azure</text>

        <path class="a" d="M300,142 H398" marker-end="url(#m)"/>
        <path class="a" d="M560,142 H598" marker-end="url(#m)"/>
        <path class="a" d="M750,142 H788" marker-end="url(#m)"/>
        <path class="a" d="M920,142 H948" marker-end="url(#m)" stroke-dasharray="4 4"/>
        <text class="lab" x="430" y="200">duplicates removed</text>
        <text class="lab" x="430" y="214">(row_id)</text>

        <!-- rules row -->
        <rect class="b rule" x="500" y="300" width="160" height="60" rx="30"/>
        <text class="t" x="580" y="326">exceptional.csv</text><text class="s" x="580" y="344">checked 1st</text>
        <rect class="b rule" x="690" y="300" width="170" height="60" rx="30"/>
        <text class="t" x="775" y="326">known_expenses.csv</text><text class="s" x="775" y="344">checked 2nd</text>
        <path class="a" d="M590,298 C600,240 640,200 660,176" marker-end="url(#m)"/>
        <path class="a" d="M765,298 C755,240 715,200 692,176" marker-end="url(#m)"/>

        <!-- outputs + loop -->
        <rect class="b you" x="900" y="300" width="160" height="60" rx="30"/>
        <text class="t" x="980" y="326">uncategorised.csv</text><text class="s" x="980" y="344">what no rule caught</text>
        <path class="a" d="M880,172 C900,220 950,260 970,298" marker-end="url(#m)"/>

        <rect class="b you" x="760" y="420" width="190" height="56" rx="28"/>
        <text class="t" x="855" y="444">You add a rule</text><text class="s" x="855" y="461">one line per merchant</text>
        <path class="a loop" d="M960,362 C950,392 935,410 924,420" marker-end="url(#my)"/>
        <path class="a loop" d="M790,420 C780,400 776,385 775,364" marker-end="url(#my)"/>
        <text class="lab y" x="610" y="412">run again: the list shrinks</text>

        <text class="lab" x="20" y="30">Run everything with:  python -m family_budget</text>
        <g font-family="system-ui,sans-serif" font-size="11">
          <circle cx="26" cy="486" r="5" fill="#e5f3eb" stroke="#2f7d55"/><text x="36" y="490" fill="#5b6876">You</text>
          <circle cx="80" cy="486" r="5" fill="#e6f0f9" stroke="#1f6fb2"/><text x="90" y="490" fill="#5b6876">Code, runs by itself</text>
          <circle cx="210" cy="486" r="5" fill="#f8eddd" stroke="#a8641b"/><text x="220" y="490" fill="#5b6876">Rule files you edit</text>
        </g>
      </svg>
