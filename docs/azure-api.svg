<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1100 540" xmlns="http://www.w3.org/2000/svg" width="1100" height="540" role="img" aria-label="What happens on one request: you send GET /api/months to the Functions host, which calls api(req) in function_app.py. api downloads transactions.csv from Blob Storage with an identity, turns the bytes into a table, turns the URL into /months, asks route for the answer and sends the JSON back." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<style>
.bg{fill:#ffffff}
.b{fill:#ffffff;stroke:#d4dae1;stroke-width:1.2}
.b.code{fill:#e6f0f9;stroke:#1f6fb2}
.b.you{fill:#e5f3eb;stroke:#2f7d55}
.b.az{fill:#f8eddd;stroke:#a8641b}
.b.frame{fill:none;stroke:#1f6fb2;stroke-width:1.5}
.b.pkg{fill:none;stroke:#5b6876;stroke-dasharray:5 4}
.t{fill:#16202c;font:600 13px system-ui,-apple-system,"Segoe UI",sans-serif}
.tc{text-anchor:middle}
.h{fill:#1f6fb2;font:700 14px system-ui,-apple-system,"Segoe UI",sans-serif}
.s{fill:#5b6876;font:400 11.5px ui-monospace,Menlo,Consolas,monospace}
.l{fill:#5b6876;font:400 12px system-ui,-apple-system,"Segoe UI",sans-serif}
.n{fill:#1f6fb2}.nt{fill:#ffffff;font:700 12px system-ui,sans-serif;text-anchor:middle}
.a{stroke:#5b6876;stroke-width:1.5;fill:none}
.a.g{stroke:#2f7d55}
.a.o{stroke:#a8641b;stroke-dasharray:5 4}
.a.p{stroke:#5b6876;stroke-dasharray:3 4}
.ah{fill:#5b6876}.ahg{fill:#2f7d55}.aho{fill:#a8641b}
</style>
<rect class="bg" width="1100" height="540"/>
<defs>
  <marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="ah" d="M0,0L10,5L0,10z"/></marker>
  <marker id="mg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="ahg" d="M0,0L10,5L0,10z"/></marker>
  <marker id="mo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="aho" d="M0,0L10,5L0,10z"/></marker>
</defs>

<!-- you -->
<rect class="b you" x="30" y="40" width="210" height="80" rx="10"/>
<text class="t" x="46" y="68">You (browser or curl)</text>
<text class="s" x="46" y="90">GET /api/months</text>
<text class="s" x="46" y="106">    ?code=KEY</text>

<!-- host -->
<rect class="b az" x="30" y="200" width="210" height="110" rx="10"/>
<text class="t" x="46" y="226">Functions host</text>
<text class="l" x="46" y="248">matches /api/{*path}</text>
<text class="s" x="46" y="270">Azure: func-family-…</text>
<text class="s" x="46" y="288">Mac:   func start :7071</text>

<path class="a" d="M100,120 V198" marker-end="url(#m)"/>
<text class="l" x="106" y="166">request</text>
<path class="a g" d="M180,198 V122" marker-end="url(#mg)"/>
<text class="l" x="186" y="166" style="fill:#2f7d55">JSON</text>

<!-- function frame -->
<rect class="b frame" x="290" y="30" width="460" height="460" rx="12"/>
<text class="h" x="310" y="58">function_app.py · api(req)</text>
<text class="l" x="310" y="76">runs once per request, then stops</text>

<path class="a" d="M240,255 H288" marker-end="url(#m)"/>
<text class="l" x="246" y="245">calls</text>

<!-- steps -->
<g>
  <rect class="b code" x="310" y="96" width="420" height="62" rx="8"/>
  <circle class="n" cx="334" cy="127" r="12"/><text class="nt" x="334" y="131">1</text>
  <text class="t" x="356" y="121">read_transactions_blob()</text>
  <text class="l" x="356" y="140">download the CSV → bytes</text>
</g>
<g>
  <rect class="b code" x="310" y="174" width="420" height="62" rx="8"/>
  <circle class="n" cx="334" cy="205" r="12"/><text class="nt" x="334" y="209">2</text>
  <text class="t" x="356" y="199">load_transactions(bytes)</text>
  <text class="l" x="356" y="218">bytes → pandas table</text>
</g>
<g>
  <rect class="b code" x="310" y="252" width="420" height="62" rx="8"/>
  <circle class="n" cx="334" cy="283" r="12"/><text class="nt" x="334" y="287">3</text>
  <text class="t" x="356" y="277">target_from_url(url)</text>
  <text class="s" x="356" y="296">/api/months?code=KEY → /months</text>
</g>
<g>
  <rect class="b code" x="310" y="330" width="420" height="62" rx="8"/>
  <circle class="n" cx="334" cy="361" r="12"/><text class="nt" x="334" y="365">4</text>
  <text class="t" x="356" y="355">route("GET", "/months", table)</text>
  <text class="l" x="356" y="374">picks the answer → (200, monthly totals)</text>
</g>
<g>
  <rect class="b code" x="310" y="408" width="420" height="62" rx="8"/>
  <circle class="n" cx="334" cy="439" r="12"/><text class="nt" x="334" y="443">5</text>
  <text class="t" x="356" y="433">HttpResponse(json)</text>
  <text class="l" x="356" y="452">send it back</text>
</g>
<path class="a" d="M520,158 V172" marker-end="url(#m)"/>
<path class="a" d="M520,236 V250" marker-end="url(#m)"/>
<path class="a" d="M520,314 V328" marker-end="url(#m)"/>
<path class="a" d="M520,392 V406" marker-end="url(#m)"/>
<path class="a g" d="M310,439 H135 V312" marker-end="url(#mg)"/>

<!-- blob -->
<rect class="b az" x="800" y="80" width="270" height="96" rx="10"/>
<text class="t" x="816" y="106">Blob Storage</text>
<text class="s" x="816" y="128">stfamilybudgetmdg</text>
<text class="s" x="816" y="146">└ processed/</text>
<text class="s" x="816" y="164">  └ transactions.csv (fake)</text>
<path class="a o" d="M732,127 H798" marker-end="url(#mo)"/>
<text class="l" x="800" y="200">who may read it:</text>
<text class="l" x="800" y="218">Azure → the app's managed identity</text>
<text class="l" x="800" y="236">Mac → your az login</text>
<text class="l" x="800" y="254">(no keys, no passwords)</text>

<!-- package -->
<rect class="b pkg" x="800" y="290" width="270" height="140" rx="10"/>
<text class="t" x="816" y="316">src/family_budget/api.py</text>
<text class="l" x="816" y="338">the logic used in steps 2, 3, 4</text>
<text class="l" x="816" y="358">same code as on your Mac</text>
<text class="l" x="816" y="378">covered by pytest</text>
<text class="s" x="816" y="408">function_app.py adds no logic</text>
<path class="a p" d="M732,205 C770,205 770,330 798,330" />
<path class="a p" d="M732,283 C760,283 770,350 798,350" />
<path class="a p" d="M732,361 H798" />

<text class="l" x="30" y="522">Same code on the Mac and on Azure: only the host (func start / Azure) and who signs in to Blob Storage (az login / managed identity) change.</text>
</svg>
